<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Job Sheet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="masthead">
            <div class="masthead-meta">
                <span>Vol. 01</span>
                <span>Updated every morning</span>
                <span>Free edition</span>
            </div>
            <h1>The Job <em>Sheet</em></h1>
            <p class="tagline">Open roles from companies worth working for, pulled straight from their hiring boards.</p>
        </header>

        <div class="controls">
            <label>Looking for
                <input id="include" placeholder="engineer, developer">
            </label>
            <label>Leave out
                <input id="exclude" placeholder="manager, senior">
            </label>
        </div>

        <p id="summary">Loading jobs...</p>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr><th>Company</th><th>Role</th><th>Location</th></tr>
                </thead>
                <tbody id="results"></tbody>
            </table>
        </div>
    </div>

    <script>
        let allJobs = [];        // every job, loaded once
        let updated = "";

        // YOUR EXERCISE: translate your Python is_match into JavaScript
        function isMatch(title, include, exclude) {
            const check = title.toLowerCase();

            for (const word of exclude) {          // Python: for word in exclude:
                if (check.includes(word)) {        //   if word in check:
                    return false;                  //     return False
                }
            }

            if (include.length === 0) {            // nothing typed: show everything
                return true;
            }

            for (const word of include) {          // Python: for word in include:
                if (check.includes(word)) {
                    return true;
                }
            }

            return false;
        }

        // turns "engineer, Developer , " into ["engineer", "developer"]
        function parseWords(text) {
            return text.split(",")
                .map(word => word.trim().toLowerCase())
                .filter(word => word !== "");
        }

        function render(jobs) {
            let rows = "";
            for (const job of jobs) {
                rows += `<tr>
                    <td>${job.company}</td>
                    <td><a href="${job.url}" target="_blank">${job.title}</a></td>
                    <td>${job.location}</td>
                </tr>`;
            }
            document.getElementById("results").innerHTML = rows;
            document.getElementById("summary").textContent =
                `Showing ${jobs.length} of ${allJobs.length} jobs · last updated ${updated}`;
        }

        function applyFilters() {
            const include = parseWords(document.getElementById("include").value);
            const exclude = parseWords(document.getElementById("exclude").value);
            const matches = allJobs.filter(job => isMatch(job.title, include, exclude));
            render(matches);
        }

        async function loadJobs() {
            const summary = document.getElementById("summary");
            try {
                const response = await fetch("jobs.json", { cache: "no-store" });
                const data = await response.json();
                allJobs = Array.isArray(data) ? data : data.jobs;
                updated = data.updated || "unknown";
                applyFilters();
            } catch (error) {
                summary.textContent = "Error: " + error.message;
                summary.style.color = "red";
            }
        }

        // re-filter every time the visitor types
        document.getElementById("include").addEventListener("input", applyFilters);
        document.getElementById("exclude").addEventListener("input", applyFilters);

        loadJobs();
    </script>
</body>
</html>
